name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (typecheck + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test
        env:
          # No live DB credentials in CI — the integration suite in
          # tests/api.test.js self-skips without them. Only the unit tests
          # (academic-terms.test.ts, enrollment-logic.test.ts) actually run.
          CI: true

  frontend:
    name: Frontend (typecheck + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit -p .
      - run: npm test

  # Playwright e2e is intentionally NOT run here: the specs require a live
  # backend + database + seeded demo accounts (E2E_*_USERNAME/PASSWORD env
  # vars), which this workflow doesn't provision. Run `npm run e2e` locally
  # or wire up a separate deploy-gated workflow with real credentials/secrets
  # if E2E coverage in CI becomes a priority.
